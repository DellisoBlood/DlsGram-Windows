name: DlsGram Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create private API header
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TDESKTOP_API_ID -notmatch '^\d+$') {
            throw 'Invalid TDESKTOP_API_ID secret'
          }

          if ($env:TDESKTOP_API_HASH -notmatch '^[a-fA-F0-9]+$') {
            throw 'Invalid TDESKTOP_API_HASH secret'
          }

          $headerDir = Join-Path $env:GITHUB_WORKSPACE 'DesktopPrivate'
          $headerFile = Join-Path $headerDir 'custom_api_id.h'

          New-Item -ItemType Directory -Force -Path $headerDir | Out-Null

          $header = @(
            '#pragma once'
            "constexpr auto ApiId = $($env:TDESKTOP_API_ID);"
            "constexpr auto ApiHash = `"$($env:TDESKTOP_API_HASH)`";"
          )

          Set-Content -Path $headerFile -Value $header -Encoding ascii

          if (-not (Test-Path $headerFile)) {
            throw 'API header was not created'
          }

          Write-Host 'API header created successfully.'

      # Dependencies are installed to the parent of the checkout (runner.workspace),
      # not into the repository itself.
      - name: Prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Platform = 'x64'

          cmd /d /c "Telegram\build\prepare\win.bat silent"

          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency preparation failed'
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Telegram/build/target is gitignored, so configure.py cannot infer
          # the official target on CI; pass API credentials explicitly.
          cmd /d /c "Telegram\configure.bat x64 -D TDESKTOP_API_ID=$env:TDESKTOP_API_ID -D TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH"

          if ($LASTEXITCODE -ne 0) {
            throw 'CMake configuration failed'
          }

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --build out --config Release --target Telegram --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw 'Telegram build failed'
          }

      - name: Find executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Filter Telegram.exe -Recurse -File |
            Select-Object -First 1

          if (-not $exe) {
            throw 'Telegram.exe not found'
          }

          "TELEGRAM_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Found $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      - name: Upload Telegram.exe
        uses: actions/upload-artifact@v4
        with:
          name: DlsGram-Windows-x64
          path: ${{ env.TELEGRAM_EXE }}
          if-no-files-found: error
          retention-days: 7
